<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#242039">
<title>登录 · StudyPilot</title>
<link rel="stylesheet" href="login.css?v=20260915">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="card" role="main">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5z"/></svg>
      </div>
      <div>
        <h1>StudyPilot</h1>
        <p class="tagline">让知识与提问更近</p>
      </div>
    </div>

    <form id="loginForm" autocomplete="on" novalidate>
      <label class="field">
        <span>账号</span>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="请输入账号" required autofocus>
      </label>
      <label class="field">
        <span>密码</span>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="请输入密码" required>
      </label>
      <label class="remember">
        <input id="remember" type="checkbox" checked>
        <span>7 天内免登录</span>
      </label>

      <button id="submitBtn" type="submit">
        <span class="btn-text">登录</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <p id="error" class="error" role="alert" aria-live="polite"></p>
    </form>

    <p class="hint">仅限本人使用，登录后可持续访问知识库问答与评测。</p>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const userInput = document.getElementById('username');
    const passInput = document.getElementById('password');
    const btn = document.getElementById('submitBtn');
    const errBox = document.getElementById('error');

    function setLoading(on) {
      btn.disabled = on;
      btn.classList.toggle('loading', on);
    }
    function showError(msg) {
      errBox.textContent = msg || '';
      errBox.classList.toggle('show', Boolean(msg));
    }

    // 已登录则直接进主页
    fetch('api/auth/status', { headers: { Accept: 'application/json' } })
      .then(r => r.json())
      .then(d => { if (d && d.authenticated) location.replace('./'); })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('');
      const username = userInput.value.trim();
      const password = passInput.value;
      if (!username || !password) {
        showError('请填写账号和密码');
        return;
      }
      setLoading(true);
      try {
        const res = await fetch('api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.authenticated) {
          location.replace('./');
          return;
        }
        showError(data.error || (res.status === 429 ? '尝试过于频繁，请稍后再试' : '账号或密码错误'));
        passInput.value = '';
        passInput.focus();
      } catch (err) {
        showError('网络异常，请稍后重试');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
