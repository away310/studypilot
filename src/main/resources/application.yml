server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: studypilot

  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        model: ${STUDYPILOT_CHAT_MODEL:qwen-plus}
        temperature: 0.3
        max-tokens: 2048
      embedding:
        model: text-embedding-v3
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  datasource:
    url: jdbc:sqlite:./data/studypilot.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false

app:
  # 应用内登录账号（替代 Nginx Basic 认证）；密码只从环境变量读取，不写入仓库
  auth:
    username: ${STUDYPILOT_AUTH_USER:away}
    password: ${STUDYPILOT_AUTH_PASSWORD:}
  kb:
    # 默认示例知识库目录（相对项目根，可改成绝对路径）
    default-dir: ./kb
    # 启动时是否自动导入 default-dir 下的示例文档
    auto-seed: true
    # 结构感知切分参数：单块最大字符数、相邻块重叠
    chunk-max-chars: 800
    chunk-overlap-chars: 100
  retrieval:
    # 粗召回候选数、精取块数
    recall-candidates: 20
    top-k: 5
    # 混合检索权重
    vector-weight: 0.6
    keyword-weight: 0.4
    # BM25 分数映射 score / (score + k)，固定 k，分数不是概率
    bm25-saturation: 1.0
  answer:
    # 拒答阈值：基于 top 命中块的「最大向量相似度」。
    # 初始阈值需按自己的语料与负例校准，主题相似不代表资料足以回答。
    reject-threshold: 0.50

logging:
  level:
    com.studypilot: INFO
